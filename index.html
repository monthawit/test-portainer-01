<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portainer Test Stack</title>
<style>
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #dc2626;
    color: #e2e8f0;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
  }
  .card {
    text-align: center;
    padding: 2.5rem 3rem;
    background: #1e293b;
    border-radius: 12px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.4);
  }
  h1 { margin: 0 0 0.5rem; font-size: 1.75rem; color: #38bdf8; }
  p { margin: 0.25rem 0; color: #94a3b8; }
  .badge {
    display: inline-block;
    margin-top: 1rem;
    padding: 0.35rem 0.9rem;
    border-radius: 999px;
    background: #16a34a;
    color: white;
    font-size: 0.85rem;
  }
</style>
</head>
<body>
  <div class="card">
    <h1>test-portainer-01</h1>
    <p>This stack is running via Docker Compose.</p>
    <p id="hostname">host: loading...</p>
    <span class="badge">OK</span>
  </div>
  <script>
    document.getElementById('hostname').textContent = 'served from: ' + window.location.host;
  </script>
</body>
</html>
